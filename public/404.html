<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Page Not Found | Shas Fresh Mart</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#26384a 0,#111827 55%,#080d15 100%);color:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    main{width:min(100%,560px);padding:48px 28px;border:1px solid rgba(229,190,70,.4);border-radius:24px;background:rgba(15,23,42,.78);box-shadow:0 24px 80px #0007}
    .brand{color:#f3cf55;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    .code{margin:24px 0 0;color:#f3cf55;font-size:clamp(76px,18vw,124px);font-weight:900;line-height:1;letter-spacing:-.07em}
    h1{margin:18px 0 12px;font-size:clamp(24px,5vw,34px)}
    p{margin:0;color:#cbd5e1;font-size:16px;line-height:1.7}
    .line{width:72px;height:3px;margin:24px auto;background:#f3cf55;border-radius:10px}
    small{display:block;margin-top:28px;color:#94a3b8}
  </style>
</head>
<body>
  <main>
    <div class="brand">Shas Fresh Mart</div>
    <div class="code">404</div>
    <div class="line"></div>
    <h1>Page not found</h1>
    <p>This site is temporarily unavailable. Please check back later.</p>
    <small>Shas Fresh Mart · Imperial Freshness</small>
  </main>
</body>
</html>
